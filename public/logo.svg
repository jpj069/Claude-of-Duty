<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none"
     role="img" aria-label="Claude of Duty">
  <title>Claude of Duty</title>
  <!-- Vector, not the generated raster: the mark has to sit on a transparent nav,
       a 16 px favicon and a light surface, and stay ~1 KB. Studio designed it;
       this is the shipped artwork.

       Third pass, and the first one that means anything. The earlier marks were a
       hexagon with a crosshair in it — decoration that could belong to any shooter.
       This one is a stencilled C knocked out of a shield, and the C doubles as a
       broken sight ring with the square as its aiming point. One shape, two
       readings, and the letter is the project's own initial rather than a generic
       reticle. -->

  <mask id="cut">
    <!-- shield: flat top with chamfered shoulders, sides down, point at the bottom -->
    <path d="M19 11 H45 L49 16 V36 L32 53 L15 36 V16 Z" fill="#fff" />
    <!-- the C, knocked out: ring open to the right, squared terminals -->
    <path d="M37.3 21.5 A9.2 9.2 0 1 0 37.3 36.5"
          stroke="#000" stroke-width="5.2" stroke-linecap="butt" fill="none" />
    <!-- aiming point, also negative -->
    <rect x="29.7" y="26.4" width="4.6" height="4.6" fill="#000" />
  </mask>

  <path d="M19 11 H45 L49 16 V36 L32 53 L15 36 V16 Z" fill="#FFC400" mask="url(#cut)" />
</svg>
